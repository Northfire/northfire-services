/*
 * Northfire Services: this server's secrets. Copy to secrets.conf and chmod 600.
 * Never commit secrets.conf.
 */

/* The link to UnrealIRCd on this machine. The password must match the one in
 * UnrealIRCd's link block for services.northfire.net. */
uplink
{
	host = "127.0.0.1"
	ipv6 = no
	ssl = no
	port = 7000
	password = "change-me"
}

/* The forum relay's RPC token (openssl rand -hex 32). */
define
{
	name = "rpc.token"
	value = "change-me"
}
