/*
 * nf_authguard: limits password guessing on every sign-in route (IDENTIFY,
 * SASL, RECOVER, GROUP, the web panel and RPC). See modules/northfire/nf_authguard.cpp.
 */
module
{
	name = "nf_authguard"

	/* One address (IPv6 by /64): this many failures in ip_window locks it for ip_lock,
	 * doubling for each lockout in a row up to ip_lock_max. The same limit applies to
	 * one account from one address. */
	ip_limit = 5
	ip_window = 15m
	ip_lock = 15m
	ip_lock_max = 1d

	/* One account from all addresses together. Addresses that have signed in to the
	 * account before are not locked out (so guessing can't lock the owner out). */
	account_limit = 20
	account_window = 1h
	account_lock = 30m
	account_lock_max = 6h

	/* How many addresses to remember per account, and for how long. */
	trusted_max = 5
	trusted_days = 90
}
command { service = "OperServ"; name = "AUTHGUARD"; command = "operserv/authguard"; permission = "operserv/authguard"; }

/*
 * nf_tlsonly: refuse NickServ commands carrying a password from plain (non-TLS)
 * connections. Off by default; uncomment to turn it on.
 */
#module
{
	name = "nf_tlsonly"
	#message = "Connect with TLS (port 6697) to use passwords; your password was not checked."
}

/*
 * The RPC interface used by the forum (northfire.dev/forums) to check sign-ins.
 * It listens on 127.0.0.1 only; the forum reaches it through nf-anope-rpcd, which
 * passes the person's address in X-Forwarded-For so nf_authguard counts them
 * one by one. The token (in secrets.conf) may only call the two methods the
 * forum needs.
 */
module
{
	name = "httpd"
	httpd
	{
		name = "httpd/main"
		ip = "127.0.0.1"
		port = 8091
		timeout = 30
		extforward_ip = "127.0.0.1"
		extforward_header = "X-Forwarded-For"
	}
}
module
{
	name = "jsonrpc"
	server = "httpd/main"
	token
	{
		token = "${rpc.token}"
		methods = "anope.checkCredentials anope.user"
	}
}
module { name = "rpc_user" }
module { name = "rpc_data" }
