/*
 * Northfire Services: the Northfire modules and settings.
 * Built by Kyle Bargman, 2026-11-22. Included from anope.conf.
 */

/*
 * nf_authguard: limits password guessing on every sign-in route (IDENTIFY,
 * SASL, RECOVER, GROUP, the web panel and RPC). See modules/northfire/nf_authguard.cpp.
 */
module
{
	name = "nf_authguard"

	/* One address (IPv6 by /64): this many failures in ip_window locks it for ip_lock,
	 * doubling for each lockout in a row up to ip_lock_max. The same limit applies to
	 * one account from one address. */
	ip_limit = 5
	ip_window = 15m
	ip_lock = 15m
	ip_lock_max = 1d

	/* One account from all addresses together. Addresses that have signed in to the
	 * account before are not locked out (so guessing can't lock the owner out). */
	account_limit = 20
	account_window = 1h
	account_lock = 30m
	account_lock_max = 6h

	/* How many addresses to remember per account, and for how long. */
	trusted_max = 5
	trusted_days = 90
}
command { service = "OperServ"; name = "AUTHGUARD"; command = "operserv/authguard"; permission = "operserv/authguard"; }

/*
 * nf_security: security notices to the owner (notice, memo and email) when an
 * account's password, email address or client certificates change, when a
 * password reset code is used, or when its password is being guessed. Also
 * NickServ SESSIONS (where you're signed in) and SIGNOUT (sign the others out).
 */
module { name = "nf_security" }
command { service = "NickServ"; name = "SESSIONS"; command = "nickserv/sessions"; }
command { service = "NickServ"; name = "SIGNOUT"; command = "nickserv/signout"; }

/*
 * nf_twostep: optional two-step sign-in with an authenticator app (TOTP), with
 * single-use recovery codes. NickServ 2FA turns it on and off; NickServ CODE
 * finishes a sign-in. Staff with nickserv/twostep/reset can turn it off for an
 * account (2FA RESET <nick>).
 */
module { name = "nf_twostep" }
command { service = "NickServ"; name = "2FA"; command = "nickserv/twostep"; }
command { service = "NickServ"; name = "CODE"; command = "nickserv/code"; }

/*
 * nf_tlsonly: refuse NickServ commands carrying a password from plain (non-TLS)
 * connections. Off by default; uncomment to turn it on.
 */
#module
{
	name = "nf_tlsonly"
	#message = "Connect with TLS (port 6697) to use passwords; your password was not checked."
}

/*
 * The RPC interface used by the forum (northfire.dev/forums) to check sign-ins.
 * It listens on 127.0.0.1 only; the forum reaches it through nf-anope-rpcd, which
 * passes the person's address in X-Forwarded-For so nf_authguard counts them
 * one by one. The token (in secrets.conf) may only call the methods the forum
 * needs: sign-in checks, and nf_forum's and nf_passpolicy's (Kyle Bargman, 2026-11-22).
 */
module
{
	name = "httpd"
	httpd
	{
		name = "httpd/main"
		ip = "127.0.0.1"
		port = 8091
		timeout = 30
		extforward_ip = "127.0.0.1"
		extforward_header = "X-Forwarded-For"
	}
}
module
{
	name = "jsonrpc"
	server = "httpd/main"
	token
	{
		token = "${rpc.token}"
		methods = "anope.checkCredentials anope.user northfire.loginToken northfire.account northfire.announce northfire.notify northfire.online northfire.checkPassword"
	}
}
module { name = "rpc_user" }
module { name = "rpc_data" }

/*
 * nf_passpolicy: REGISTER and SET PASSWORD refuse passwords that are too short,
 * have the nick in them, or are among the 100,000 most common (the list ships
 * as common-passwords.txt in this directory; nothing is looked up elsewhere).
 * Built by Kyle Bargman, 2026-11-22.
 */
module
{
	name = "nf_passpolicy"
	min_length = 8
	list = "common-passwords.txt"
}

/*
 * nf_forum: one-click chat from the forums (one-time login codes), new topics
 * announced in a channel, forum mentions sent to IRC, who's on IRC for the forum,
 * and NickServ FORUM. Built by Kyle Bargman, 2026-11-22.
 */
module
{
	name = "nf_forum"
	forum_url = "https://northfire.dev/forums"
	/* channels the forum may post new topics in (space separated) */
	announce = "#Northfire"
}
command { service = "NickServ"; name = "FORUM"; command = "nickserv/forum"; }
