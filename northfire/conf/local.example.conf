/*
 * Northfire Services: this server's own settings. Copy to local.conf.
 */

/* Services opers (accounts; they must also be IRC opers). */
oper
{
	name = "YourNick"
	type = "Services Root"
	require_oper = yes
}

/* Turn on to import a 2.0 database (anope.db) the first time; db_json then
 * keeps it. Remove after the first start. */
#module
{
	name = "db_flatfile"
	database = "anope.db"
}
