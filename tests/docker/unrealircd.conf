/* Northfire Services test network: one UnrealIRCd 6 server + services, all local.
 * Built by Kyle Bargman */
include "modules.default.conf";
loadmodule "cloak_sha256";
include "operclass.default.conf";
include "snomasks.default.conf";
include "help/help.conf";

me { name "irc.test.local"; info "Northfire Services test"; sid "001"; }
admin { "test"; }
class clients { pingfreq 90; maxclients 1000; sendq 200k; recvq 8000; }
class servers { pingfreq 60; connfreq 15; maxclients 10; sendq 20M; }
allow { mask *; class clients; maxperip 1000; }

listen { ip *; port 6667; }
listen { ip *; port 6697; options { tls; } tls-options { certificate "tls/server.cert.pem"; key "tls/server.key.pem"; } }
listen { ip 127.0.0.1; port 7000; options { serversonly; } }

link services.northfire.net {
	incoming { mask 127.0.0.1; }
	password "testlinkpass";
	class servers;
}
ulines { services.northfire.net; }

oper testoper {
	class clients;
	mask *;
	password "testoperpass";
	operclass netadmin-with-override;
}

/* Tests connect many times from one address */
set {
	network-name "Northfire";
	help-channel "#help";
	default-server "irc.test.local";
	services-server "services.northfire.net";
	sasl-server "services.northfire.net";
	kline-address "test@test.local";
	cloak-keys { "YGPoBmmOrGswyf4H3RLKWIQL5JJWl6KetS6Jxy8AVkaeGGddlYnuHhDnlIWB7CHFk7fj2CQM6xU7o6eQfr6sDtK2N2"; "d65VvFDABFSE7zw1RLNfURnZTrKHr0LnsU4gcqSvWMH3CeRryZX7i5VohiOFZowaaJc2nNGHdv2rcKqJ0MR7GayzSk"; "kR409MaeWafzXZeLEzflKue01MfVzBhCeqRxPG3NFNXXo25xYx0iDZhzQQi131kpN1pAZ44ZXC9PCqmTFJu8mfYrYG"; }
	anti-flood { everyone { connect-flood 255:1; } known-users { lag-penalty 1; lag-penalty-bytes 0; } unknown-users { lag-penalty 1; lag-penalty-bytes 0; } }
	max-unknown-connections-per-ip 1000;
	handshake-delay 0;
	plaintext-policy { user allow; oper allow; server allow; }
}
blacklist-module "connthrottle";
blacklist-module "blacklist";
